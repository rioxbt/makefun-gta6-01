<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velamar Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1a26; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  /* Read aloud by a screen reader, never drawn: the canvas HUD is not text a reader can reach. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Velamar Heat: a sunlit open-world crime game. Walk with W A S D, drive with the arrow keys, press E to steal a car, click to shoot and take the yellow missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
